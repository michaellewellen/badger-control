<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Badger Control</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 3fr; font-family: sans-serif; }
    #controls { padding: 1rem; background: #1b2a49; color: white; overflow-y: auto; }
    label { display: block; margin-bottom: 1.5rem; }
    input[type=range] { width: 100%; }
    .value { float: right; font-weight: bold; }
    #game { width: 100%; height: 100%; border: 0; }
    #controls { overflow-y: auto; }
    #controls h3 { margin: 1rem 0 .3rem; font-size: .95rem; }
    #controls .row { margin-bottom: .5rem; }
    #controls input[type=range] { width: 100%; }
  </style>
</head>
<body>
  <div id="controls">
    <select id="opponent">
        <option value="balanced">Blue Badger (balanced)</option>
        <option value="rusher">Honey Badger (rusher)</option>
        <option value="economist">Grub Hoarder (economist)</option>
        <option value="sitter">Sleepy Sitter (sitter)</option>
    </select>
    <button id="start">Start new match</button>
        <input id="matchName" placeholder="league match name">
    <button id="join">Join league match</button>
    <h2>Controls</h2>
    <div id="sliders"></div>
  </div>
  <iframe id="game" src="https://netrts.snowse.io/#/match/e8d287e6-0f94-4659-9a68-fabe91a357ad"></iframe>

  <script src="app.js"></script>
</body>
</html>
