<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Badger Control</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 3fr; font-family: sans-serif; }
    #controls { padding: 1rem; background: #1b2a49; color: white; overflow-y: auto; }
    #game { width: 100%; height: 100%; border: 0; }
    #controls h2 { margin: .8rem 0 .3rem; }
    #controls h3 { margin: 1rem 0 .3rem; font-size: .95rem; }
    #controls .row { margin-bottom: .5rem; }
    #controls input[type=range] { width: 100%; }
    #controls input[type=text], #controls select { width: 100%; box-sizing: border-box; margin-bottom: .4rem; }
    #controls button { margin-bottom: .4rem; }
    #battle { display: flex; gap: .5rem; margin: .8rem 0 .3rem; }
    #attack { flex: 3; padding: .9rem; font-size: 1.2rem; font-weight: bold; background: #c0392b; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    #sides { display: flex; gap: .4rem; margin-bottom: .3rem; }
    #sides button { flex: 1; padding: .5rem; background: #a0392b; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    #serum { flex: 2; padding: .9rem; background: #8e44ad; color: white; font-weight: bold; border: 0; border-radius: 6px; cursor: pointer; }
    #serumNote { font-size: .8rem; min-height: 1.1rem; margin-bottom: .3rem; }
    #recall { flex: 1; padding: .9rem; background: #4a5d82; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    #status { font-size: .85rem; line-height: 1.4; background: #12203b; padding: .5rem; border-radius: 6px; min-height: 3.2rem; }
  </style>
</head>
<body>
  <div id="controls">
    <select id="opponent">
      <option value="balanced">Blue Badger (balanced)</option>
      <option value="rusher">Honey Badger (rusher)</option>
      <option value="economist">Grub Hoarder (economist)</option>
      <option value="sitter">Sleepy Sitter (sitter)</option>
      <option value="melee">MELEE: rusher + balanced + economist (4 armies)</option>
      <option value="brawl">BRAWL: 3 rushers (4 armies)</option>
    </select>
    <button id="start">Start new match</button>
    <input type="text" id="matchName" placeholder="league match name">
    <button id="join">Join league match</button>

    <div id="battle">
      <button id="attack">ATTACK!</button>
      <button id="serum" title="Super soldier serum: once per match, soldiers x2 speed and damage for ~30 ticks">SERUM!</button>
      <button id="recall">Recall</button>
    </div>
    <div id="sides">
      <button data-dir="left">&#9664; Left</button>
      <button data-dir="center">Center</button>
      <button data-dir="right">Right &#9654;</button>
    </div>
    <label style="font-size:.85rem"><input type="checkbox" id="raid"> Raid: soldiers kill workers only (no trebuchets, HQ left standing)</label>
    <div id="targets" style="font-size:.8rem;min-height:1rem;margin-bottom:.3rem"></div>
    <div id="serumNote"></div>
    <div id="status">No match yet.</div>

    <h2>Controls</h2>
    <div id="sliders"></div>
  </div>
  <iframe id="game" src="https://netrts.snowse.io/"></iframe>

  <script src="app.js?v=10"></script>
</body>
</html>
